<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Script to toggle AR image visibility on click -->
    <script>
      AFRAME.registerComponent('toggle-popup', {
        schema: { target: { type: 'string' } },
        init: function () {
          this.el.addEventListener('click', () => {
            const popup = document.querySelector(this.data.target);
            // Check if currently visible, then flip it
            const isVisible = popup.getAttribute('visible');
            popup.setAttribute('visible', !isVisible);
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Load all 5 PNGs -->
      <a-assets>
        <img id="imgA" src="./A.png">
        <img id="imgB" src="./B.png">
        <img id="imgC" src="./C.png">
        <img id="popB" src="./PopupB.png">
        <img id="popC" src="./PopupC.png">
      </a-assets>

      <!-- Camera with Raycaster configured for mobile touch -->
      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- This parent entity stands up 90 degrees, making everything inside it perpendicular to the card -->
        <a-entity rotation="90 0 0">
          
          <!-- PNG A: The main graphic. It is moved UP (Y=0.5) and spins on its vertical Y axis -->
          <a-image src="#imgA" position="0 0.5 0" scale="0.8 0.8 0.8" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;"></a-image>

          <!-- PNG B: Floating Icon (Left) -->
          <a-image src="#imgB" position="-0.5 0.3 0.2" scale="0.2 0.2 0.2" class="clickable" toggle-popup="target: #popup-b"></a-image>
          
          <!-- POPUP B: Hidden text bubble (appears above PNG B when clicked) -->
          <!-- Adjust width and height to match your Figma aspect ratio -->
          <a-image id="popup-b" src="#popB" position="-0.5 0.6 0.3" width="0.8" height="0.3" visible="false"></a-image>

          <!-- PNG C: Floating Icon (Right) -->
          <a-image src="#imgC" position="0.5 0.3 0.2" scale="0.2 0.2 0.2" class="clickable" toggle-popup="target: #popup-c"></a-image>
          
          <!-- POPUP C: Hidden text bubble (appears above PNG C when clicked) -->
          <a-image id="popup-c" src="#popC" position="0.5 0.6 0.3" width="0.8" height="0.3" visible="false"></a-image>

        </a-entity>
      </a-entity>
    </a-scene>

  </body>
</html>
